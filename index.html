<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Runner 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px; border: 2px solid #ff4757; }
        #game-over h1 { margin: 0 0 10px 0; color: #ff4757; }
        #restart-btn { margin-top: 15px; padding: 12px 25px; font-size: 18px; background: #2ed573; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
    <!-- Thư viện Three.js tạo đồ họa 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>Điểm: <span id="score">0</span>m</div>
        <div>Vàng: <span id="coins">0</span> 🪙</div>
    </div>

    <div id="game-over">
        <h1>GAME OVER!</h1>
        <p>Số mét chạy được: <span id="final-score">0</span>m</p>
        <p>Số vàng ăn được: <span id="final-coins">0</span> 🪙</p>
        <button id="restart-btn" onclick="resetGame()">Chơi Lại</button>
    </div>

    <script>
        let scene, camera, renderer;
        let player, playerBox;
        let currentLane = 0; // -1: Trái, 0: Giữa, 1: Phải
        const laneWidth = 3;
        let score = 0, coins = 0;
        let isGameOver = false;
        let speed = 0.4;

        let obstacles = [];
        let coinObjects = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e90ff); // Bầu trời xanh
            scene.fog = new THREE.Fog(0x1e90ff, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 2, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Đường chạy (3 làn)
            const trackGeo = new THREE.PlaneGeometry(12, 500);
            const trackMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.z = -200;
            scene.add(track);

            // Tạo nhân vật
            const playerGeo = new THREE.BoxGeometry(1, 1.8, 1);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0xff4757 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.9, 0);
            scene.add(player);

            playerBox = new THREE.Box3();

            // Lắng nghe phím
            document.addEventListener('keydown', onKeyDown);

            // Tạo vật thể ban đầu
            spawnObstacles();

            animate();
        }

        function onKeyDown(e) {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > -1) {
                currentLane--;
            } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 1) {
                currentLane++;
            }
        }

        function spawnObstacles() {
            for (let i = 0; i < 20; i++) {
                let zPos = -30 - i * 20;
                let lane = Math.floor(Math.random() * 3) - 1;

                // Tạo rào chắn / Tàu
                const obsGeo = new THREE.BoxGeometry(2, Math.random() > 0.5 ? 2 : 3.5, 3);
                const obsMat = new THREE.MeshLambertMaterial({ color: 0x2f3542 });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(lane * laneWidth, obsGeo.parameters.height / 2, zPos);
                scene.add(obs);
                obstacles.push(obs);

                // Tạo đồng xu ở làn khác
                let coinLane = (lane + 1) % 3 - 1;
                const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
                const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(coinLane * laneWidth, 1, zPos);
                scene.add(coin);
                coinObjects.push(coin);
            }
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Di chuyển nhân vật mượt mà giữa các làn
            const targetX = currentLane * laneWidth;
            player.position.x += (targetX - player.position.x) * 0.2;

            // Di chuyển các vật thể về phía nhân vật
            obstacles.forEach(obs => {
                obs.position.z += speed;
                if (obs.position.z > 10) obs.position.z -= 400;

                // Va chạm
                const obsBox = new THREE.Box3().setFromObject(obs);
                playerBox.setFromObject(player);
                if (playerBox.intersectsBox(obsBox)) {
                    gameOver();
                }
            });

            coinObjects.forEach(coin => {
                coin.position.z += speed;
                coin.rotation.z += 0.05;
                if (coin.position.z > 10) coin.position.z -= 400;

                // Ăn xu
                const coinBox = new THREE.Box3().setFromObject(coin);
                playerBox.setFromObject(player);
                if (playerBox.intersectsBox(coinBox)) {
                    coins++;
                    document.getElementById('coins').innerText = coins;
                    coin.position.z -= 400; // Đẩy đồng xu đi chỗ khác
                }
            });

            // Cập nhật điểm
            score += Math.round(speed);
            document.getElementById('score').innerText = score;
            speed += 0.0001; // Tăng dần tốc độ

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-coins').innerText = coins;
        }

        function resetGame() {
            location.reload();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
